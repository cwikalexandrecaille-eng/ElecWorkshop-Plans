name: Déployer ElecWorkshop Plans
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site depuis l'archive
        run: |
          set -eu
          test -f elecworkshop-plans-site.zip
          mkdir -p _site
          unzip -o elecworkshop-plans-site.zip -d _site
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/style.css
          test -s _site/config.js
          cp app.js _site/app.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
