name: Déployer ElecWorkshop Plans
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site depuis l'archive
        run: |
          set -eu
          test -f elecworkshop-plans-site.zip
          mkdir -p _site
          unzip -o elecworkshop-plans-site.zip -d _site
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/style.css
          test -s _site/config.js
          cp app.js _site/app.js
          cp index.html _site/index.html
          cp pdf-editor.js _site/pdf-editor.js
          cp pdf-editor.css _site/pdf-editor.css
          cp redesign.css _site/redesign.css
          cp ui-v3.css _site/ui-v3.css
          cp icon.svg _site/icon.svg
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          cp push.js _site/push.js
          cp offline.js _site/offline.js
          cp updates.js _site/updates.js
          node scripts/prepare-release.cjs _site "$GITHUB_SHA"
          node --check _site/updates.js
          node --check _site/offline.js
          node --check _site/push.js
          node --check _site/sw.js
          python3 -m venv /tmp/ew-pwa-icons
          /tmp/ew-pwa-icons/bin/pip install --quiet CairoSVG==2.7.1
          /tmp/ew-pwa-icons/bin/python -c "import cairosvg; [(cairosvg.svg2png(url='_site/icon.svg',write_to='_site/'+name,output_width=size,output_height=size)) for name,size in [('apple-touch-icon.png',180),('icon-192.png',192),('icon-512.png',512)]]"
          test -s _site/apple-touch-icon.png
          test -s _site/icon-192.png
          test -s _site/icon-512.png
          node --check _site/app.js
          node --check _site/pdf-editor.js
          test -s _site/ui-v3.css
          grep -q 'ui-v3.css' _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT }}
      - id: deployment
        name: Publier l’archive générée
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Archive Pages invalide');
            }
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: idToken
            });
            const deploymentId = deployment.id || context.sha;
            core.setOutput('page_url', deployment.page_url || 'https://cwikalexandrecaille-eng.github.io/ElecWorkshop-Plans/');
            const failed = new Set([
              'deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost'
            ]);
            for (let attempt = 0; attempt < 90; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data: state } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                ...context.repo, deploymentId
              });
              core.info('État de la publication : ' + state.status);
              if (state.status === 'succeed') return;
              if (failed.has(state.status)) throw new Error('Publication Pages : ' + state.status);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
              ...context.repo, deploymentId
            });
            throw new Error('Publication Pages trop longue');
